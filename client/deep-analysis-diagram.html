    :root {

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 2rem;
    }
    h1 { color: var(--accent); font-size: 1.3rem; margin-bottom: 0.3rem; }
    p.sub { color: var(--subtext); font-size: 0.8rem; margin-bottom: 1.2rem; }
    .diagram-wrap {
      width: 100%;
      max-width: 1160px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      overflow-x: auto;
    }
    svg { display: block; width: 100%; min-width: 900px; }
    .legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1rem;
      font-size: 0.78rem;
      color: var(--subtext);
    }
    .leg { display: flex; align-items: center; gap: 0.35rem; }
    .ls { width: 20px; height: 13px; border-radius: 3px; flex-shrink: 0; }
    .back-link {
      margin-top: 1.5rem;
      color: var(--accent);
      font-size: 0.85rem;
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 0.4rem 1rem;
      border-radius: 6px;
    }
    .back-link:hover { background: var(--surface); }
  </style>
</head>
